services:
  torrvia:
    build:
      context: .
      args:
        VERSION: ${TORRVIA_VERSION:-1.0.0}
    image: torrvia:latest
    container_name: torrvia
    restart: unless-stopped
    ports:
      - "${TORRVIA_PORT:-8080}:8080"
    volumes:
      # Mount the directory so atomic Settings saves can rename the file inside it.
      - type: bind
        source: ./config
        target: /config
        bind:
          create_host_path: false
      # Search history
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "/torrvia", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
