services:
  torrvia:
    build:
      context: .
      args:
        VERSION: ${TORRVIA_VERSION:-1.0.0}
    image: torrvia:latest
    container_name: torrvia
    restart: unless-stopped
    ports:
      - "${TORRVIA_PORT:-8080}:8080"
    volumes:
      # Configuration contains credentials; keep permissions at 600.
      # Run ./torrvia -check on the host to create this file before the first container startup.
      # Docker creates a directory if the mounted file does not exist.
      - ./config.toml:/config/config.toml
      # Search history
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "/torrvia", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
